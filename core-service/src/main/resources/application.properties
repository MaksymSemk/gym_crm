spring.application.name=gym_crm

spring.datasource.url=jdbc:postgresql://localhost:5435/gym_crm_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-init.sql
spring.jpa.defer-datasource-initialization=true

logging.level.root=WARN
logging.level.com.example.gym_crm=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]){magenta} %clr([tx:%X{transactionId}]){cyan} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health, metrics, prometheus

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign Circuit Breaker activation
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4J Configuration
resilience4j.circuitbreaker.instances.trainer-workload-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainer-workload-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainer-workload-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainer-workload-service.wait-duration-in-open-state=5s

grpc.client.trainer-workload-service.address=static://localhost:9090
grpc.client.trainer-workload-service.negotiation-type=plaintext

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
kafka.topic.trainer-workload=trainer-workload-topic