name: epam-gym-crm

services:
  gym-crm-db:
    image: postgres:17-alpine
    container_name: gym-crm-db
    hostname: gym-crm-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: gym_crm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Europe/Kyiv
    volumes:
      - gym_crm_data:/var/lib/postgresql/data
    networks:
      - gym-crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_crm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: gym-crm-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL - for containers on gym-crm-network, EXTERNAL - for the host machine (IDE, tests)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - gym-crm-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  mongodb:
    image: mongo:latest
    container_name: gym-crm-mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_INITDB_DATABASE: trainer_workload
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gym-crm-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    image: gym-crm/core-service:latest
    container_name: core-service
    hostname: core-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://gym-crm-db:5432/gym_crm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TZ: Europe/Kyiv
    depends_on:
      gym-crm-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gym-crm-network
    restart: on-failure

  trainer-workload-service:
    build:
      context: ./trainer-workload-service
      dockerfile: Dockerfile
    image: gym-crm/trainer-workload-service:latest
    container_name: trainer-workload-service
    hostname: trainer-workload-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MONGODB_URI: mongodb://user:pass@mongodb:27017/trainer_workload?authSource=admin
      EUREKA_CLIENT_ENABLED: "false"
      TZ: Europe/Kyiv
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gym-crm-network
    restart: on-failure

  blank-service:
    build:
      context: ./blank-service
      dockerfile: Dockerfile
    container_name: blank-service
    networks:
      - gym-crm-network

networks:
  gym-crm-network:
    name: gym-crm-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  gym_crm_data:
  kafka-data:
  mongo_data:
