spring.application.name=integration-tests
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=3600000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.main.allow-bean-definition-overriding=true

# Kafka Producer (core-service)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Disable type headers so the consumer uses its own target DTO class
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Consumer (trainer-workload-service)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=integration-test-workload-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.trainerworkloadservice.workload.dto.TrainerWorkloadRequestDto
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topic Name Resolution (covers all possible property variations in both services)
kafka.topics.trainer-workload=trainer-workload-topic
kafka.topics.trainer-workload-dlt=trainer-workload-topic.DLT
kafka.topic.trainer-workload=trainer-workload-topic
kafka.topic.name=trainer-workload-topic
spring.kafka.template.default-topic=trainer-workload-topic

eureka.client.enabled=false
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.kafka=DEBUG