# Datasource Configuration
spring.datasource.url=jdbc:postgresql://dev-db-host:5432/gym_crm_dev_db
spring.datasource.username=postgres
spring.datasource.password=${DEV_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DDL & Data Initialization
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-init.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.gym_crm=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [tx:%X{transactionId}] %-5level %logger{36} - %msg%n

# Actuator Details
management.endpoint.health.show-details=when-authorized